{% extends 'base.html' %}

{% block title %}Supprimer la Facture{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 2rem auto;">
    <div class="card-header">
        <h1 class="card-title">⚠️ Confirmer la suppression</h1>
    </div>

    <div style="padding: 2rem; text-align: center;">
        <p style="font-size: 1.2rem; margin-bottom: 2rem;">
            Êtes-vous sûr de vouloir supprimer la facture <strong>{{ object.invoice_number }}</strong> ?
        </p>

        <p style="color: var(--text-secondary); margin-bottom: 2rem;">
            Cette action est irréversible.
        </p>

        <form method="post">
            {% csrf_token %}
            <div class="btn-group" style="justify-content: center;">
                <button type="submit" class="btn btn-danger" style="font-size: 1.1rem; padding: 0.8rem 1.5rem;">
                    🗑️ Oui, supprimer
                </button>
                <a href="{% url 'invoice_list' %}" class="btn btn-secondary"
                    style="font-size: 1.1rem; padding: 0.8rem 1.5rem;">
                    ❌ Annuler
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
